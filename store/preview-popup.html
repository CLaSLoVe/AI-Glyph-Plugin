<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Glyph popup</title>
<link rel="stylesheet" href="../glyph.css">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #f6f3ec; color-scheme: light; }
  article {
    box-sizing: border-box; width: 760px; padding: 72px 56px 0 68px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; color: #221e18;
  }
  h1 { margin: 0; font-size: 48px; font-weight: 750; line-height: 1.35; letter-spacing: 0.02em; }
  h1.en { margin-top: 32px; font-size: 36px; letter-spacing: 0; font-family: "Avenir Next", "PingFang SC", sans-serif; }
  p { margin: 12px 0 0; font-size: 28px; font-weight: 500; line-height: 1.55; }
  p.en { font-family: "Avenir Next", "PingFang SC", sans-serif; font-size: 26px; }
  .sign {
    margin-top: 36px; background: #2d3436; color: #fff; border-radius: 14px; padding: 26px 32px 28px;
  }
  .sign .cn { font-size: 52px; font-weight: 750; letter-spacing: 0.04em; line-height: 1.25; }
  .sign .sub { margin-top: 8px; font-size: 28px; font-weight: 650; letter-spacing: 0.06em; color: #ffeaa7; }
  iframe {
    position: fixed; top: 36px; right: 28px; width: 308px; height: 378px;
    border: 0; border-radius: 12px; background: #fff;
    box-shadow: 0 18px 50px rgba(40, 30, 70, 0.28), 0 0 0 1px rgba(0, 0, 0, 0.06);
    transform: scale(1.58); transform-origin: top right;
  }
</style>
</head>
<body>
  <article>
    <h1>人工智能改变世界</h1>
    <p>今天天气很好，我们一起去咖啡店喝咖啡吧。</p>
    <p>珍珠奶茶，第二杯半價，新鲜现烤面包。</p>
    <h1 class="en">Welcome to the corner cafe</h1>
    <p class="en">Fresh bread and hot coffee, open daily from seven until ten.</p>
    <div class="sign">
      <div class="cn">街角咖啡店</div>
      <div class="sub">珍珠奶茶 · 第二杯半價</div>
    </div>
  </article>
  <iframe src="../popup.html" scrolling="no"></iframe>
  <script src="../cjkdata.js"></script>
  <script src="../garble.js"></script>
  <script src="../content.js"></script>
</body>
</html>
