<!doctype html><meta charset=utf-8>
<link rel=stylesheet href=../glyph.css>
<style>body{margin:10px;font:44px/1.3 "Noto Sans CJK SC",sans-serif;--aig-o:0.056em} span.c{display:inline-block;margin:2px 8px;text-align:center} small{display:block;font-size:11px;color:#888;line-height:1.2}</style>
<div id=o></div>
<script src=../cjkdata.js></script><script src=../garble.js></script>
<script>
const G=AIGlyph, T=G.cjkTables();
const chars=Array.from(decodeURIComponent(location.hash.slice(1))||'珍珠奶茶第杯价这国区过人大我的一是不了在有中上个为和也');
const o=document.getElementById('o');
function cell(seg,label){const span=document.createElement('span');span.className='c';span.appendChild(G.renderSegments([seg],document));const sm=document.createElement('small');sm.textContent=label;span.appendChild(sm);o.appendChild(span);}
for(const c of chars){
  const f=T.fake.get(c);
  if(f){ for(const [list,kf,lab] of [[f.rep2,true,'+右'],[f.rep1,false,'+左']]) for(const d of list.slice(0,2)) cell(G._fake(c,d,kf),c+lab+':'+d); continue; }
  const l=T.cut.get(c)||[];
  for(const x of l) cell({k:'han',o:c,d:x.d,keepFirst:x.keepFirst,clipC:G._cutPoly(x.o,x.p,x.keepFirst),clipD:G._cutPoly(x.o,x.p,!x.keepFirst)}, c+'|'+x.d+' '+x.o+x.p+(x.keepFirst?'前':'后'));
  if(!l.length) cell(c,c+' 无');
}
</script>
